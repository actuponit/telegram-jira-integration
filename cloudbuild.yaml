# Cloud Build pipeline for pushes to main (ADR-0001: Cloud Run + Cloud Build).
#
# Mirrors deploy/20-deploy.sh so a CI deploy and a manual deploy produce the
# same service. The values that differ per environment arrive as trigger
# substitutions rather than living in the repo, keeping deploy/config.env the
# only place a human edits coordinates.
steps:
  # Tests gate the deploy: a red build never reaches Cloud Run.
  - id: test
    name: golang:1.24
    entrypoint: go
    args: ['test', './...']

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest'
      - '.'

  # --allow-unauthenticated is required: Telegram calls the webhook
  # anonymously. Authenticity is enforced in-process by verifying the
  # X-Telegram-Bot-Api-Secret-Token header against TELEGRAM_WEBHOOK_SECRET.
  #
  # Secrets come from Secret Manager via Cloud Run's native integration, so
  # no credential is ever passed through the build.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--service-account=${_RUNTIME_SA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--min-instances=0'
      - '--max-instances=4'
      - '--timeout=120'
      - '--set-env-vars=JIRA_BASE_URL=${_JIRA_BASE_URL},JIRA_EMAIL=${_JIRA_EMAIL},JIRA_PROJECT_KEY=${_JIRA_PROJECT_KEY},TELEGRAM_ALLOWED_CHATS=${_TELEGRAM_ALLOWED_CHATS}'
      - '--set-secrets=TELEGRAM_BOT_TOKEN=telegram-bot-token:latest,GEMINI_API_KEY=gemini-api-key:latest,JIRA_API_TOKEN=jira-api-token:latest,TELEGRAM_WEBHOOK_SECRET=telegram-webhook-secret:latest'

substitutions:
  _REGION: europe-west1
  _SERVICE_NAME: telegram-jira-bot
  _AR_REPO: telegram-jira-bot
  _RUNTIME_SA_NAME: telegram-jira-bot-run
  _JIRA_BASE_URL: ''
  _JIRA_EMAIL: ''
  _JIRA_PROJECT_KEY: ''
  _TELEGRAM_ALLOWED_CHATS: ''

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest'

options:
  # The default Cloud Build service account has no bucket of its own, so
  # builds must declare where logs go or they fail to start.
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
